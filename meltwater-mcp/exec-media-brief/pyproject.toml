[project]
name = "exec-media-brief"
version = "0.1.0"
description = "Reference agent on Meltwater MCP — headless daily executive media brief (news + social)"
requires-python = ">=3.11"
dependencies = [
    "anthropic[mcp]>=0.40",   # [mcp] extra: client-side MCP tool runner (anthropic.lib.tools.mcp)
    "mcp>=1.30,<2",
    "python-dotenv>=1.0",     # load .env (optional — you can also export the vars)
]

# Run:
#   uv sync
#   cp .env.example .env                              # add ANTHROPIC_API_KEY + MELTWATER_API_TOKEN
#   uv run python exec_media_brief.py --out brief.html   # Stage 1 (needs MELTWATER_API_TOKEN)
#
# Render only (no Meltwater, handy for template work):
#   uv run python render.py sample_output/sample_brief.json --out sample_output/brief.html
